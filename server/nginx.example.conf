# Merge these locations into an existing TLS server block for share.example.com.
# Deny WHIP publishing through the viewing route.
location ~ ^/obs-live/.*/whip(?:/|$) { return 403; }
location /obs-live/ {
    proxy_pass http://127.0.0.1:8889/;
    proxy_redirect / /obs-live/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    access_log off;
    add_header Referrer-Policy "no-referrer" always;
}
